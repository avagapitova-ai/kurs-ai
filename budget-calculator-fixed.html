<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор семейного бюджета</title>

  <!-- При загрузке сразу применяем сохранённую тему, чтобы не мигала светлая -->
  <script>
    (function () {
      if (localStorage.getItem('budget-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    /*
      КАЛЬКУЛЯТОР СЕМЕЙНОГО БЮДЖЕТА
      --------------------------------
      Что умеет:
      - считать общий доход семьи
      - считать обязательные расходы
      - считать переменные расходы
      - показывать остаток бюджета
      - считать процент накоплений
      - выводить подсказку по финансовой ситуации

      Как использовать:
      1. Скопируйте весь код целиком.
      2. Вставьте в онлайн HTML-редактор или HTML-блок сайта.
      3. При необходимости измените названия полей в HTML.
    */

    /*
      ПЕРЕМЕННЫЕ ТЕМ
      --------------
      Светлая тема — значения по умолчанию в :root.
      Тёмная тема — те же имена, другие цвета в [data-theme="dark"].
    */
    :root {
      --bg-page: #f4f6f8;
      --text-main: #222222;
      --text-muted: #666666;
      --text-label: #444444;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --section-bg: #f8fafc;
      --section-border: #e5e7eb;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --input-text: #111827;
      --focus-border: #2563eb;
      --focus-ring: rgba(37, 99, 235, 0.15);
      --btn-reset-bg: #e5e7eb;
      --btn-reset-text: #111827;
      --btn-reset-hover: #d1d5db;
      --theme-btn-bg: #ffffff;
      --theme-btn-text: #111827;
      --theme-btn-border: #d1d5db;
      --theme-btn-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    [data-theme="dark"] {
      --bg-page: #0f172a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-label: #cbd5e1;
      --card-bg: #1e293b;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --section-bg: #334155;
      --section-border: #475569;
      --input-bg: #1e293b;
      --input-border: #64748b;
      --input-text: #f8fafc;
      --focus-border: #60a5fa;
      --focus-ring: rgba(96, 165, 250, 0.25);
      --btn-reset-bg: #475569;
      --btn-reset-text: #f8fafc;
      --btn-reset-hover: #64748b;
      --theme-btn-bg: #334155;
      --theme-btn-text: #f8fafc;
      --theme-btn-border: #64748b;
      --theme-btn-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .budget-calculator {
      max-width: 980px;
      margin: 40px auto;
      padding: 24px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .budget-calculator h1 {
      margin: 0 0 10px;
      font-size: 32px;
      text-align: center;
    }

    .budget-calculator .subtitle {
      margin: 0 0 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 16px;
    }

    .calculator-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .calculator-section {
      background: var(--section-bg);
      border: 1px solid var(--section-border);
      border-radius: 16px;
      padding: 20px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .calculator-section h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-label);
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: var(--input-bg);
      color: var(--input-text);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.25s ease;
    }

    .field input:focus {
      border-color: var(--focus-border);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s;
    }

    .calculate-btn {
      background: #2563eb;
      color: #ffffff;
    }

    .calculate-btn:hover {
      background: #1d4ed8;
    }

    .reset-btn {
      background: var(--btn-reset-bg);
      color: var(--btn-reset-text);
    }

    .reset-btn:hover {
      background: var(--btn-reset-hover);
    }

    /*
      КНОПКА ПЕРЕКЛЮЧЕНИЯ ТЕМЫ
      -------------------------
      Закреплена в правом нижнем углу экрана.
      Не перекрывает основной контент калькулятора.
    */
    .theme-toggle {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1000;
      width: 56px;
      height: 56px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      background: var(--theme-btn-bg);
      color: var(--theme-btn-text);
      box-shadow: var(--theme-btn-shadow);
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.06);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 3px;
    }

    /* Подпись для скринридеров: видна только при озвучивании */
    .theme-toggle .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .result {
      margin-top: 30px;
      padding: 24px;
      border-radius: 18px;
      background: #111827;
      color: #ffffff;
      display: none;
    }

    .result h2 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 24px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 18px;
      border-radius: 14px;
      text-align: center;
    }

    .result-card span {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .result-card strong {
      font-size: 22px;
    }

    .advice {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 16px;
      text-align: center;
    }

    .positive {
      color: #86efac;
    }

    .warning {
      color: #fde68a;
    }

    .negative {
      color: #fca5a5;
    }

    @media (max-width: 900px) {
      .calculator-grid,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .budget-calculator {
        margin: 20px;
        padding: 18px;
      }

      .budget-calculator h1 {
        font-size: 26px;
      }

      .theme-toggle {
        right: 16px;
        bottom: 16px;
        width: 50px;
        height: 50px;
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!--
    КНОПКА СМЕНЫ ТЕМЫ (светлая ↔ тёмная)
    Расположение: правый нижний угол.
    Иконка меняется в зависимости от активной темы.
  -->
  <button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    onclick="toggleTheme()"
    aria-label="Переключить на тёмную тему"
    title="Переключить тему"
  >
    <span class="sr-only">Переключить тему оформления</span>
    <span id="themeToggleIcon" aria-hidden="true">🌙</span>
  </button>

  <div class="budget-calculator">
    <h1>Калькулятор семейного бюджета</h1>
    <p class="subtitle">
      Введите доходы и расходы семьи, чтобы рассчитать остаток бюджета и понять финансовую ситуацию.
    </p>

    <div class="calculator-grid">

      <!-- БЛОК ДОХОДОВ -->
      <div class="calculator-section">
        <h2>Доходы</h2>

        <div class="field">
          <label for="salary1">Зарплата 1</label>
          <input type="number" id="salary1" placeholder="Например: 80000">
        </div>

        <div class="field">
          <label for="salary2">Зарплата 2</label>
          <input type="number" id="salary2" placeholder="Например: 60000">
        </div>

        <div class="field">
          <label for="extraIncome">Дополнительный доход</label>
          <input type="number" id="extraIncome" placeholder="Подработки, пособия и т.д.">
        </div>
      </div>

      <!-- БЛОК ОБЯЗАТЕЛЬНЫХ РАСХОДОВ -->
      <div class="calculator-section">
        <h2>Обязательные расходы</h2>

        <div class="field">
          <label for="rent">Жильё / ипотека / аренда</label>
          <input type="number" id="rent" placeholder="Например: 40000">
        </div>

        <div class="field">
          <label for="utilities">Коммунальные платежи</label>
          <input type="number" id="utilities" placeholder="Например: 8000">
        </div>

        <div class="field">
          <label for="loans">Кредиты / рассрочки</label>
          <input type="number" id="loans" placeholder="Например: 15000">
        </div>

        <div class="field">
          <label for="education">Образование / детский сад</label>
          <input type="number" id="education" placeholder="Например: 12000">
        </div>
      </div>

      <!-- БЛОК ПЕРЕМЕННЫХ РАСХОДОВ -->
      <div class="calculator-section">
        <h2>Переменные расходы</h2>

        <div class="field">
          <label for="food">Продукты</label>
          <input type="number" id="food" placeholder="Например: 35000">
        </div>

        <div class="field">
          <label for="transport">Транспорт</label>
          <input type="number" id="transport" placeholder="Например: 10000">
        </div>

        <div class="field">
          <label for="health">Здоровье</label>
          <input type="number" id="health" placeholder="Например: 7000">
        </div>

        <div class="field">
          <label for="entertainment">Развлечения и покупки</label>
          <input type="number" id="entertainment" placeholder="Например: 15000">
        </div>
      </div>

    </div>

    <div class="buttons">
      <button class="calculate-btn" onclick="calculateBudget()">Рассчитать бюджет</button>
      <button class="reset-btn" onclick="resetCalculator()">Очистить</button>
    </div>

    <!-- БЛОК РЕЗУЛЬТАТОВ -->
    <div class="result" id="resultBlock">
      <h2>Результат расчёта</h2>

      <div class="result-grid">
        <div class="result-card">
          <span>Общий доход</span>
          <strong id="totalIncome">0 ₽</strong>
        </div>

        <div class="result-card">
          <span>Общие расходы</span>
          <strong id="totalExpenses">0 ₽</strong>
        </div>

        <div class="result-card">
          <span>Остаток</span>
          <strong id="balance">0 ₽</strong>
        </div>

        <div class="result-card">
          <span>Можно отложить</span>
          <strong id="savingPercent">0%</strong>
        </div>
      </div>

      <div class="advice" id="adviceText"></div>
    </div>
  </div>

  <script>
    /*
      ТЕМА ОФОРМЛЕНИЯ
      ---------------
      Ключ в localStorage: budget-theme
      Значения: "light" (по умолчанию) или "dark"
    */
    const THEME_STORAGE_KEY = 'budget-theme';

    function getCurrentTheme() {
      return document.documentElement.getAttribute('data-theme') === 'dark'
        ? 'dark'
        : 'light';
    }

    /*
      Обновляет иконку кнопки и подпись для доступности.
      В светлой теме показываем луну (переход в тёмную),
      в тёмной — солнце (переход в светлую).
    */
    function updateThemeToggleUI() {
      const isDark = getCurrentTheme() === 'dark';
      const btn = document.getElementById('themeToggle');
      const icon = document.getElementById('themeToggleIcon');

      icon.textContent = isDark ? '☀️' : '🌙';
      btn.setAttribute(
        'aria-label',
        isDark ? 'Переключить на светлую тему' : 'Переключить на тёмную тему'
      );
      btn.title = isDark ? 'Светлая тема' : 'Тёмная тема';
    }

    /*
      Включает или выключает тёмную тему и сохраняет выбор пользователя.
    */
    function toggleTheme() {
      const isDark = getCurrentTheme() === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';

      if (nextTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }

      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      updateThemeToggleUI();
    }

    /* Синхронизируем кнопку с темой, уже применённой при загрузке страницы */
    updateThemeToggleUI();

    /*
      Функция getValue(id)
      --------------------
      Получает значение из поля input.
      Если поле пустое, возвращает 0.
      Это нужно, чтобы калькулятор не ломался при незаполненных полях.
    */
    function getValue(id) {
      return Number(document.getElementById(id).value) || 0;
    }

    /*
      Функция formatMoney(amount)
      ---------------------------
      Форматирует число в рубли.
      Например: 150000 превращается в "150 000 ₽"
    */
    function formatMoney(amount) {
      return amount.toLocaleString('ru-RU') + ' ₽';
    }

    /*
      Главная функция calculateBudget()
      ---------------------------------
      Считает:
      1. общий доход
      2. общие расходы
      3. остаток бюджета
      4. процент накоплений
      5. финансовую рекомендацию
    */
    function calculateBudget() {
      const income =
        getValue('salary1') +
        getValue('salary2') +
        getValue('extraIncome');

      const expenses =
        getValue('rent') +
        getValue('utilities') +
        getValue('loans') +
        getValue('education') +
        getValue('food') +
        getValue('transport') +
        getValue('health') +
        getValue('entertainment');

      const balance = income - expenses;

      let savingPercent = 0;

      if (income > 0) {
        savingPercent = Math.round((balance / income) * 100);
      }

      document.getElementById('totalIncome').textContent = formatMoney(income);
      document.getElementById('totalExpenses').textContent = formatMoney(expenses);
      document.getElementById('balance').textContent = formatMoney(balance);
      document.getElementById('savingPercent').textContent = savingPercent + '%';

      const adviceText = document.getElementById('adviceText');

      if (income === 0) {
        adviceText.textContent = 'Введите хотя бы один источник дохода, чтобы получить корректный расчёт.';
        adviceText.className = 'advice warning';
      } else if (balance < 0) {
        adviceText.textContent = 'Расходы превышают доходы. Стоит пересмотреть необязательные траты или найти способ увеличить доход.';
        adviceText.className = 'advice negative';
      } else if (savingPercent < 10) {
        adviceText.textContent = 'Бюджет в плюсе, но запас небольшой. Желательно стремиться откладывать хотя бы 10–20% дохода.';
        adviceText.className = 'advice warning';
      } else if (savingPercent <= 30) {
        adviceText.textContent = 'Хороший результат. У семьи остаётся комфортный запас для накоплений и непредвиденных расходов.';
        adviceText.className = 'advice positive';
      } else {
        adviceText.textContent = 'Отличный результат. У вас высокий потенциал для накоплений, инвестиций или крупных финансовых целей.';
        adviceText.className = 'advice positive';
      }

      document.getElementById('resultBlock').style.display = 'block';
    }

    /*
      Функция resetCalculator()
      -------------------------
      Очищает все поля и скрывает блок результата.
    */
    function resetCalculator() {
      const inputs = document.querySelectorAll('input');

      inputs.forEach(function(input) {
        input.value = '';
      });

      document.getElementById('resultBlock').style.display = 'none';
    }
  </script>

</body>
</html>
